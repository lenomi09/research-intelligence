[project]
name = "research-intelligence-platform"
version = "0.0.1"
description = "Transforms collections of scientific papers into structured, evidence-backed research intelligence: multi-paper comparison, research landscape clustering, and gap analysis, built on RAG/VLM/agent supporting technologies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project maintainer" }]

# Sprint 1 (Scientific Paper Ingestion) dependencies only — see
# docs/decisions.md ADR-014 for why each was chosen and docs/development-guidelines.md
# ("add a dependency only when it's needed") for the policy behind keeping this list
# minimal. No RAG/embedding/vector-store/LLM/VLM dependencies belong here yet.
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2",
]

[project.optional-dependencies]
# Local dev/test tooling, not required to run the ingestion pipeline itself.
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
# Deliberately small: pyflakes (bugs/unused code), import sorting, and a few
# common-sense checks — not an aggressive/opinionated ruleset (see
# docs/development-guidelines.md, "do not over-engineer").
select = ["E", "F", "I", "B", "UP"]
