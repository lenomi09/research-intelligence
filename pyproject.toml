[project]
name = "research-intelligence-platform"
version = "0.0.1"
description = "Transforms collections of scientific papers into structured, evidence-backed research intelligence: multi-paper comparison, research landscape clustering, and gap analysis, built on RAG/VLM/agent supporting technologies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project maintainer" }]

# Intentionally empty during Phase 0 (planning). Dependencies are added
# incrementally as each phase actually needs them (see docs/implementation-plan.md
# and docs/development-guidelines.md — "add a dependency only when it's needed").
dependencies = []

[project.optional-dependencies]
# Populated in Phase 1+ (e.g. pytest, ruff) once implementation begins.
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
